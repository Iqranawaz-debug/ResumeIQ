# Local production-like stack: API on :8000, site on :8080.
# Copy .env.example to .env first (it may stay empty; AI is optional).
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Persist accounts and working data across restarts. Remove to keep data in memory only.
      RESUMEIQ_DB_PATH: /app/data/resumeiq.db
    volumes:
      - resumeiq-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  resumeiq-data:
